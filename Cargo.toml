[package]
name = "typedef"
version = "0.5.0"
edition = "2024"
default-run = "typedef"
repository = "https://github.com/rawatpriyansh17/typedef"
description = "A terminal typing playground."
license = "MIT"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
unicode-width = "0.2"
fs2 = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
