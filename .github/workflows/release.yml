name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: runner.os == 'Linux'
        run: echo 'RUSTFLAGS=-C linker=musl-gcc' >> "$GITHUB_ENV"
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify packaged commands
        shell: bash
        run: |
          target/${{ matrix.target }}/release/typedef --version
          target/${{ matrix.target }}/release/tpdf --help
      - run: python scripts/package_release.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: typedef-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Prepare installer and Homebrew formula
        run: |
          python3 scripts/homebrew_formula.py release
          cp scripts/install.sh release/install.sh
          cd release
          sha256sum install.sh > install.sh.sha256
          sha256sum typedef.rb > typedef.rb.sha256
          cat *.sha256 > SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "typedef $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
